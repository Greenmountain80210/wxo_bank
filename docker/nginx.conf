server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # データやスクリプトを更新したとき古いキャッシュが使われないよう毎回再検証させる
    location /fx-waterfall/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
